<form class="login-form" [formGroup]="signupForm" (ngSubmit)="signup(signupForm)">
    <h5 class="text-center text-danger" *ngIf="showMsg">{{msg}}!</h5>
    <!-- @if (showMsg) {
     @if (signupForm.controls['firstName'].touched && !signupForm.controls['firstName'].valid) {
        <h5 class="text-center text-danger">First Name should have min 2 characters and max 10 characters</h5>
     }@else if (signupForm.controls['lastName'].touched && !signupForm.controls['lastName'].valid) {
        <h5 class="text-center text-danger">Last Name should have min 4 characters and max 10 characters</h5>
     }@else if (signupForm.controls['userEmail'].touched && !signupForm.controls['userEmail'].valid) {
        <h5 class="text-center text-danger">Invalid email!</h5>
     }@else if (signupForm.controls['userPassword'].touched && !signupForm.controls['userPassword'].valid) {
        <h5 class="text-center text-danger">Password must have min 8 characters</h5>
     }} -->
    <h2>Sign up</h2>
    <div class="row my-3">
        <div class="col-md-6 form-group">
            <label for="yourName">First Name</label>
            <input type="text" class="form-control" id="yourName" aria-describedby="nameHelp"
                placeholder="Enter your first name" formControlName="firstName" required>
        </div>
        <div class="col-md-6 form-group">
            <label for="yourLastName">Last Name</label>
            <input type="text" class="form-control" id="yourLastName" aria-describedby="nameHelp"
                placeholder="Enter your last name" formControlName="lastName">
        </div>
    </div>
    <div class="form-group mb-3">
        <label for="exampleInputEmail1">Email address</label>
        <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp"
            placeholder="Enter email" formControlName="userEmail">
    </div>
    <div class="form-group">
        <label for="exampleInputPassword1">Password</label>
        <input type="password" class="form-control" id="exampleInputPassword1" placeholder="Password"
            formControlName="userPassword">
    </div>
    <div class="mt-3">
        <button type="submit" class="btn btn-primary">Sign up</button>
    </div>
    <div class="separator mt-3">or</div>
    <div class="text-center">
        <a routerLink="/login" role="button" routerLinkActive="active" class="signup-link">Already have an account? Sign
            in</a>
    </div>
</form>
