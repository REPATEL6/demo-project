<div class="boxs p-4 rounded">
        <form [formGroup]="taskForm" (ngSubmit)="saveTask(taskForm,1)">
        <div class="">
            <h4 class="text-center text-danger" *ngIf="msgToDisplay">{{response.msg}}</h4>
            <span class="d-flex justify-content-between">
                <h4 class="task-text">Tasks:</h4>
                <button type="button" (click)="btnOFF()" class="btn-close" aria-label="Close"></button>
            </span>
            <ul class="list-group btn-bottom p-0">

                <div class="input-taskName">
                    <input type="text" placeholder="New Task" formControlName="taskName" class="form-control">
                </div>
                <div class="input-desc mt-4">
                    <textarea class="fixed-textarea form-control" placeholder="Task Description"
                        formControlName="taskDescription"></textarea>
                </div>
                <div class="row mt-3">
                    <div class="col-sm-10">
                        <label for="dropdown">List:</label>
                        <select id="dropdown" name="dropdown" formControlName="listName">
                            @for(option of dropdownOptions; track option.id) {
                                <option [value]="option.id">{{ option.name }}</option>
                            }
                        </select>
                    </div>
                </div>
                <div class="my-3 row">
                    <div class="col-sm-10">
                        <label for="date">Due Date:</label>
                        <input type="date" id="date" [min]="getCurrentDate()" formControlName="dueDate">
                    </div>
                </div>
                <div class="mb-3 row me-0">
                    <div class="col-sm-12">
                        <label>Tags:</label>
                        <span class="badge tag-badge">Tag 1</span>
                        <span class="badge tag-badge">Tag 2</span>
                        <span class="badge bg-secondary-subtle tag-badge"><i class="fa-solid fa-plus"></i> Add
                            Tag</span>
                    </div>
                </div>

            </ul>
        </div>
        <div class="text-center btn-save-del footer">
            <button type="button" (click)="taskForm.reset()" class="btn btn-outline-secondary">Delete Task</button>
                <button type="submit" class="btn btn-outline-warning">Save Changes</button>
        </div>
    </form>
</div>
